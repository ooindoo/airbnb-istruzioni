<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="robots" content="noindex, nofollow, noarchive"/>
<title>Gestione · Suite in Centro</title>
<style>
:root {
  --red: #FF385C;
  --black: #222222;
  --gray: #717171;
  --gray-light: #B0B0B0;
  --border: #DDDDDD;
  --border-inner: #EBEBEB;
  --surface: #F7F7F7;
  --white: #FFFFFF;
  --radius: 12px;
  --radius-sm: 8px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  color: var(--black);
  background: var(--surface);
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
}

/* ── LOGIN ── */
#login-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100dvh;
  padding: 32px 24px;
  background: var(--white);
}
.login-logo { font-size: 40px; margin-bottom: 10px; }
.login-title { font-size: 20px; font-weight: 700; color: var(--black); }
.login-sub { font-size: 14px; color: var(--gray); margin-top: 4px; margin-bottom: 32px; }
.login-form { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 12px; }

.field-input {
  width: 100%;
  padding: 14px 16px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font: inherit;
  font-size: 16px;
  background: var(--white);
  color: var(--black);
  -webkit-appearance: none;
  transition: border-color 0.15s;
}
.field-input:focus { outline: none; border-color: var(--black); }
.field-input::placeholder { color: var(--gray-light); }

.btn-black {
  width: 100%;
  padding: 14px;
  background: var(--black);
  color: var(--white);
  border: none;
  border-radius: var(--radius-sm);
  font: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  min-height: 52px;
  transition: opacity 0.15s;
}
.btn-black:active { opacity: 0.85; }
.btn-black:disabled { opacity: 0.45; cursor: default; }

.btn-red {
  width: 100%;
  padding: 14px;
  background: var(--red);
  color: var(--white);
  border: none;
  border-radius: var(--radius-sm);
  font: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: opacity 0.15s;
}
.btn-red:active { opacity: 0.85; }
.btn-red:disabled { opacity: 0.45; cursor: default; }

.login-error {
  color: var(--red);
  font-size: 14px;
  text-align: center;
  min-height: 18px;
}

/* ── APP ── */
#app-screen { display: none; }

/* ── TOPBAR (identica a index.html) — solo stile, selettore lingua disabilitato ── */
.icon {
  display: inline-block;
  flex-shrink: 0;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
  vertical-align: middle;
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 56px;
}
.lang-sw {
  display: flex;
  align-items: center;
  gap: 2px;
  background: var(--surface);
  border-radius: 999px;
  padding: 4px;
}
.lb {
  background: none;
  border: none;
  font: inherit;
  font-weight: 600;
  font-size: 13px;
  color: var(--gray);
  padding: 6px 12px;
  border-radius: 999px;
  cursor: pointer;
  min-width: 44px;
  min-height: 36px;
  line-height: 1;
}
.lb.active { background: var(--black); color: var(--white); }
.lb:disabled { cursor: default; opacity: 1; }
.print-btn {
  width: 44px;
  height: 44px;
  border: none;
  background: var(--surface);
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--black);
  flex-shrink: 0;
}
.print-btn:hover { background: var(--border); }

/* ── BARRA PAGINA (titolo + logout) ── */
.dash-topbar {
  position: sticky;
  top: 56px;
  z-index: 49;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.topbar-title { font-size: 15px; font-weight: 700; line-height: 1.2; }
.topbar-sub { font-size: 12px; color: var(--gray); }
.logout-btn {
  background: none;
  border: none;
  font: inherit;
  font-size: 13px;
  color: var(--gray);
  cursor: pointer;
  padding: 8px 4px;
  flex-shrink: 0;
}
.logout-btn:active { color: var(--red); }

.content {
  max-width: 680px;
  margin: 0 auto;
  padding: 16px 16px 48px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ── BADGE ── */
.summary-badge {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.badge-icon { font-size: 30px; flex-shrink: 0; line-height: 1; }
.badge-body { flex: 1; min-width: 0; }
.badge-count { font-size: 22px; font-weight: 800; color: var(--red); line-height: 1.2; }
.badge-label { font-size: 13px; color: var(--gray); margin-top: 2px; }
.badge-ok .badge-count { color: #2A7A45; }

/* ── CARD ── */
.section-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--gray);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 14px;
}

/* ── FORM (riusato per la modifica in-place) ── */
.form-row { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.field-label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 5px; }

.field-sm, select.field-sm {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font: inherit;
  font-size: 15px;
  background: var(--surface);
  color: var(--black);
  -webkit-appearance: none;
}
.field-sm:focus { outline: none; border-color: var(--black); background: var(--white); }

.guest-block {
  border-top: 1px solid var(--border-inner);
  padding-top: 14px;
  margin-top: 4px;
}
.guest-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--black);
  margin-bottom: 12px;
}

.mini-divider {
  font-size: 11px;
  font-weight: 700;
  color: var(--gray);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin: 14px 0 8px;
  padding-top: 12px;
  border-top: 1px dashed var(--border-inner);
}

.checkbox-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 600;
  margin-top: 2px;
}
.checkbox-row input[type="checkbox"] { width: 18px; height: 18px; flex-shrink: 0; }

.fattura-fields { display: none; flex-direction: column; gap: 10px; margin-top: 10px; }
.fattura-fields.open { display: flex; }

.outline-btn {
  width: 100%;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1.5px solid var(--black);
  border-radius: var(--radius-sm);
  background: var(--white);
  color: var(--black);
  font: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s;
  margin-top: 4px;
}
.outline-btn:active { background: var(--surface); }

.remove-guest-btn {
  background: none;
  border: none;
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  color: var(--gray);
  cursor: pointer;
  padding: 10px 0 2px;
  text-align: left;
}
.remove-guest-btn:active { color: var(--red); }

.form-error { font-size: 13px; color: var(--red); margin-top: 8px; display: none; }

/* ── SPINNER ── */
.spinner {
  width: 18px;
  height: 18px;
  border: 2.5px solid rgba(255,255,255,0.4);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: none;
}
.spinner.on { display: inline-block; }
.spinner-inline {
  width: 14px;
  height: 14px;
  border: 2px solid rgba(0,0,0,0.15);
  border-top-color: currentColor;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: none;
  flex-shrink: 0;
}
.spinner-inline.on { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── DOC CARD ── */
.doc-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: opacity 0.2s;
}
.doc-card.fading { opacity: 0.4; pointer-events: none; }

.doc-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  cursor: pointer;
}
.doc-icon {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  background: var(--surface);
  border: 1px solid var(--border-inner);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.doc-info { flex: 1; min-width: 0; }
.doc-name {
  font-size: 15px;
  font-weight: 700;
  line-height: 1.3;
}
.doc-date { font-size: 13px; color: var(--gray); margin-top: 2px; }
.doc-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 999px;
  flex-shrink: 0;
  white-space: nowrap;
}
.doc-badge.pending { background: #FFF0F3; color: var(--red); }
.doc-badge.inserito { background: #EDF8F1; color: #2A7A45; }

.doc-chevron {
  font-size: 13px;
  color: var(--gray-light);
  flex-shrink: 0;
  transition: transform 0.18s;
}
.doc-card.open .doc-chevron { transform: rotate(180deg); }

.doc-detail {
  display: none;
  padding: 0 16px 16px;
  border-top: 1px solid var(--border-inner);
}
.doc-card.open .doc-detail { display: block; padding-top: 14px; }

.edit-body {
  padding: 14px 16px 16px;
  border-top: 1px solid var(--border-inner);
}

.guest-detail + .guest-detail {
  border-top: 1px dashed var(--border-inner);
  margin-top: 12px;
  padding-top: 12px;
}
.guest-detail-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--gray);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
}
.field-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  padding: 5px 0;
  font-size: 14px;
  border-bottom: 1px solid var(--border-inner);
}
.field-row:last-child { border-bottom: none; }
.field-k { color: var(--gray); flex-shrink: 0; }
.field-v { font-weight: 600; text-align: right; word-break: break-word; user-select: text; }

.fattura-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--gray);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin: 10px 0 4px;
  padding-top: 10px;
  border-top: 1px dashed var(--border-inner);
}

.doc-actions {
  display: flex;
  border-top: 1px solid var(--border-inner);
}
.doc-action {
  flex: 1;
  padding: 13px 8px;
  background: none;
  border: none;
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: background 0.12s;
}
.doc-action:active { background: var(--surface); }
.doc-action + .doc-action { border-left: 1px solid var(--border-inner); }
.doc-action.confirm { color: #2A7A45; }
.doc-action.delete { color: var(--red); }
.doc-action:disabled { opacity: 0.6; cursor: default; }

.edit-actions { display: flex; gap: 10px; margin-top: 16px; }
.edit-actions .outline-btn, .edit-actions .btn-red { margin-top: 0; }

/* ── INSERITI TOGGLE ── */
.inseriti-toggle {
  background: none;
  border: none;
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  color: var(--gray);
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  padding: 6px 0;
  width: 100%;
  text-align: left;
}
.chv { display: inline-block; transition: transform 0.18s; }
.inseriti-toggle.open .chv { transform: rotate(180deg); }
#inseriti-list { display: none; flex-direction: column; gap: 10px; margin-top: 10px; }
#inseriti-list.open { display: flex; }

/* ── EMPTY STATE ── */
.empty {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 40px 20px;
  text-align: center;
  color: var(--gray);
}
.empty-icon { font-size: 36px; margin-bottom: 10px; }
.empty p { font-size: 14px; line-height: 1.6; }

/* ── TOAST ── */
#toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(6px);
  background: var(--black);
  color: var(--white);
  border-radius: 999px;
  padding: 9px 20px;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s, transform 0.18s;
  z-index: 200;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V4h10v5"/><rect x="5" y="9" width="14" height="7" rx="1"/><path d="M7 16v4h10v-4"/></symbol>
</svg>

<!-- ── LOGIN ── -->
<div id="login-screen">
  <div class="login-logo">🏠</div>
  <div class="login-title">Gestione Suite</div>
  <div class="login-sub">Area riservata host</div>
  <form class="login-form" id="login-form">
    <input type="password" class="field-input" id="login-pw"
      placeholder="Password" autocomplete="current-password" autocapitalize="none"/>
    <button type="submit" class="btn-black" id="login-btn">Accedi</button>
    <div class="login-error" id="login-error"></div>
  </form>
</div>

<!-- ── APP ── -->
<div id="app-screen">
  <header class="topbar">
    <div class="lang-sw" role="group" aria-label="Language">
      <button class="lb active" data-lang="it" disabled>IT</button>
      <button class="lb" data-lang="en" disabled>EN</button>
      <button class="lb" data-lang="es" disabled>ES</button>
      <button class="lb" data-lang="de" disabled>DE</button>
    </div>
    <button class="print-btn" id="printBtn" aria-label="Stampa">
      <svg class="icon" width="20" height="20"><use href="#i-print"/></svg>
    </button>
  </header>

  <header class="dash-topbar">
    <div>
      <div class="topbar-title">Check-in ospiti</div>
      <div class="topbar-sub">Suite in Centro · Treviso</div>
    </div>
    <button class="logout-btn" id="logout-btn">Esci</button>
  </header>

  <div class="content">

    <!-- Badge riepilogo -->
    <div class="summary-badge" id="badge">
      <div class="badge-icon" id="badge-icon">⚠️</div>
      <div class="badge-body">
        <div class="badge-count" id="badge-count">—</div>
        <div class="badge-label" id="badge-label">da inserire in Ross1000</div>
      </div>
    </div>

    <!-- Lista da inserire -->
    <div id="pending-list"></div>

    <!-- Sezione inseriti (nascosta se vuota) -->
    <div id="inseriti-section" style="display:none">
      <button class="inseriti-toggle" id="inseriti-toggle">
        Già inseriti in Ross1000 <span class="chv">▾</span>
      </button>
      <div id="inseriti-list"></div>
    </div>

  </div>
</div>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let toastTimer;

function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso.length === 10 ? iso + 'T12:00:00' : iso);
  return d.toLocaleDateString('it-IT', { day: '2-digit', month: 'short', year: 'numeric' });
}

function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── AUTH ──

async function apiFetch(url, opts = {}) {
  const res = await fetch(url, opts);
  if (res.status === 401 && url !== '/api/auth') {
    showLogin();
    throw new Error('session');
  }
  return res;
}

async function checkSession() {
  const res = await fetch('/api/auth');
  return res.ok;
}

async function doLogin(password) {
  const res = await fetch('/api/auth', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password })
  });
  return res.ok;
}

// ── BOOTSTRAP ──

(async () => {
  if (await checkSession()) showApp();
  else showLogin();
})();

function showLogin() {
  $('login-screen').style.display = 'flex';
  $('app-screen').style.display = 'none';
  setTimeout(() => $('login-pw').focus(), 80);
}

function showApp() {
  $('login-screen').style.display = 'none';
  $('app-screen').style.display = 'block';
  loadDocs();
}

// ── LOGIN ──

$('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = $('login-pw').value;
  if (!pw) return;

  $('login-btn').disabled = true;
  $('login-btn').textContent = '…';
  $('login-error').textContent = '';

  const ok = await doLogin(pw);
  if (ok) {
    showApp();
  } else {
    $('login-error').textContent = 'Password errata. Riprova.';
    $('login-btn').disabled = false;
    $('login-btn').textContent = 'Accedi';
    $('login-pw').select();
  }
});

// ── LOGOUT ──

$('logout-btn').addEventListener('click', () => {
  document.cookie = 'gestione_auth=; Max-Age=0; Path=/';
  $('login-pw').value = '';
  showLogin();
});

// ── STAMPA ──
// Il selettore lingua nell'header è solo visivo (disabilitato) — la
// dashboard resta sempre in italiano.
document.getElementById('printBtn').addEventListener('click', () => window.print());

// ── DOCS ──

let docsCache = [];
let editingIds = new Set();

async function loadDocs() {
  try {
    const res = await apiFetch('/api/documenti');
    if (!res.ok) return;
    docsCache = await res.json();
    render();
  } catch {}
}

function render() {
  const pending = docsCache.filter(d => d.stato === 'pending');
  const inseriti = docsCache.filter(d => d.stato === 'inserito');

  // Badge
  const badge = $('badge');
  if (pending.length === 0) {
    badge.classList.add('badge-ok');
    $('badge-icon').textContent = '✅';
    $('badge-count').textContent = 'Tutto in ordine';
    $('badge-label').textContent = 'nessun check-in da inserire';
  } else {
    badge.classList.remove('badge-ok');
    $('badge-icon').textContent = '⚠️';
    $('badge-count').textContent = pending.length === 1
      ? '1 check-in' : `${pending.length} check-in`;
    $('badge-label').textContent = 'da inserire in Ross1000';
  }

  // Pending list
  const pendingList = $('pending-list');
  if (pending.length === 0) {
    if (docsCache.length === 0) {
      pendingList.innerHTML = `
        <div class="empty">
          <div class="empty-icon">📋</div>
          <p>Nessun check-in registrato.<br/>Condividi il link di check-in con l'ospite per iniziare.</p>
        </div>`;
    } else {
      pendingList.innerHTML = '';
    }
  } else {
    pendingList.innerHTML = pending.map(docCard).join('');
  }

  // Inseriti section
  const sec = $('inseriti-section');
  const list = $('inseriti-list');
  if (inseriti.length === 0) {
    sec.style.display = 'none';
  } else {
    sec.style.display = 'block';
    list.innerHTML = inseriti.map(docCard).join('');
  }

  bindActions();
}

function guestFieldRows(o) {
  const rows = [
    ['Sesso', o.sesso],
    ['Cognome', o.cognome],
    ['Nome', o.nome],
    ['Data di nascita', fmtDate(o.dataNascita)],
    ['Cittadinanza', o.cittadinanza],
    ['Stato/luogo di nascita', o.luogoNascita],
    ['Stato/luogo di residenza', o.luogoResidenza],
    ['Tipo documento', o.tipoDocumento],
    ['Numero documento', o.numeroDocumento],
    ['Stato/luogo di rilascio', o.luogoRilascio]
  ].map(([k, v]) => `
    <div class="field-row">
      <span class="field-k">${esc(k)}</span>
      <span class="field-v">${esc(v || '—')}</span>
    </div>`).join('');

  let fattura = '';
  if (o.indirizzoResidenza || o.codiceFiscale) {
    fattura = `<div class="fattura-label">Per fattura</div>`;
    if (o.indirizzoResidenza) {
      fattura += `
      <div class="field-row">
        <span class="field-k">Indirizzo di residenza</span>
        <span class="field-v">${esc(o.indirizzoResidenza)}</span>
      </div>`;
    }
    if (o.codiceFiscale) {
      fattura += `
      <div class="field-row">
        <span class="field-k">Codice Fiscale</span>
        <span class="field-v">${esc(o.codiceFiscale)}</span>
      </div>`;
    }
  }

  return rows + fattura;
}

function guestNames(ospiti) {
  const names = ospiti.map(o => `${o.cognome || ''} ${o.nome || ''}`.trim()).filter(Boolean);
  return names.join(' e ') || 'Ospite non specificato';
}

// ── MODIFICA (edit in-place) ──

function guestEditFields(docId, n, o) {
  o = o || {};
  const pfx = `ef-${docId}-g${n}`;
  const hasFattura = !!(o.indirizzoResidenza || o.codiceFiscale);
  const req = n === 1 ? 'required' : '';
  return `
    <div class="guest-block" ${n === 1 ? 'style="border-top:none;padding-top:0"' : ''}>
      <div class="guest-title">Ospite ${n}</div>
      <div class="form-row">
        <div>
          <label class="field-label">Sesso</label>
          <select id="${pfx}-sesso" class="field-sm" ${req}>
            <option value="" ${!o.sesso ? 'selected' : ''} disabled>Seleziona</option>
            <option value="M" ${o.sesso === 'M' ? 'selected' : ''}>M</option>
            <option value="F" ${o.sesso === 'F' ? 'selected' : ''}>F</option>
          </select>
        </div>
      </div>
      <div class="form-row-2">
        <div><label class="field-label">Cognome</label><input type="text" id="${pfx}-cognome" class="field-sm" value="${esc(o.cognome || '')}" ${req}/></div>
        <div><label class="field-label">Nome</label><input type="text" id="${pfx}-nome" class="field-sm" value="${esc(o.nome || '')}" ${req}/></div>
      </div>
      <div class="form-row"><div><label class="field-label">Data di nascita</label><input type="date" id="${pfx}-dataNascita" class="field-sm" value="${o.dataNascita || ''}" ${req}/></div></div>
      <div class="form-row"><div><label class="field-label">Cittadinanza</label><input type="text" id="${pfx}-cittadinanza" class="field-sm" value="${esc(o.cittadinanza || '')}" ${req}/></div></div>
      <div class="form-row"><div><label class="field-label">Stato/luogo di nascita</label><input type="text" id="${pfx}-luogoNascita" class="field-sm" value="${esc(o.luogoNascita || '')}" ${req}/></div></div>
      <div class="form-row"><div><label class="field-label">Stato/luogo di residenza</label><input type="text" id="${pfx}-luogoResidenza" class="field-sm" value="${esc(o.luogoResidenza || '')}" ${req}/></div></div>
      <div class="form-row-2">
        <div><label class="field-label">Tipo documento</label>
          <select id="${pfx}-tipoDocumento" class="field-sm" ${req}>
            <option value="" ${!o.tipoDocumento ? 'selected' : ''} disabled>Seleziona</option>
            <option ${o.tipoDocumento === "Carta d'identità" ? 'selected' : ''}>Carta d'identità</option>
            <option ${o.tipoDocumento === 'Passaporto' ? 'selected' : ''}>Passaporto</option>
          </select>
        </div>
        <div><label class="field-label">Numero documento</label><input type="text" id="${pfx}-numeroDocumento" class="field-sm" value="${esc(o.numeroDocumento || '')}" ${req}/></div>
      </div>
      <div class="form-row"><div><label class="field-label">Stato/luogo di rilascio</label><input type="text" id="${pfx}-luogoRilascio" class="field-sm" value="${esc(o.luogoRilascio || '')}" ${req}/></div></div>

      <div class="mini-divider">Per fattura</div>
      <label class="checkbox-row"><input type="checkbox" id="${pfx}-fatturaCheck" ${hasFattura ? 'checked' : ''}/> Residente in Italia (per fattura)</label>
      <div class="fattura-fields ${hasFattura ? 'open' : ''}" id="${pfx}-fatturaFields">
        <div><label class="field-label">Indirizzo di residenza completo</label><input type="text" id="${pfx}-indirizzoResidenza" class="field-sm" value="${esc(o.indirizzoResidenza || '')}"/></div>
        <div><label class="field-label">Codice Fiscale</label><input type="text" id="${pfx}-codiceFiscale" class="field-sm" value="${esc(o.codiceFiscale || '')}" autocapitalize="characters"/></div>
      </div>
      ${n === 2 ? `<button type="button" class="remove-guest-btn" data-remove-edit-guest="${docId}">− Rimuovi secondo ospite</button>` : ''}
    </div>`;
}

function editFormHTML(doc) {
  const docId = doc.id;
  const o1 = doc.ospiti?.[0] || {};
  const o2 = doc.ospiti?.[1];
  return `
  <div class="edit-body">
    <div class="form-row-2">
      <div><label class="field-label">Data arrivo</label><input type="date" id="ef-${docId}-checkin" class="field-sm" value="${doc.checkIn || ''}" required/></div>
      <div><label class="field-label">Data partenza</label><input type="date" id="ef-${docId}-checkout" class="field-sm" value="${doc.checkOut || ''}" required/></div>
    </div>
    ${guestEditFields(docId, 1, o1)}
    <button type="button" class="outline-btn" id="ef-${docId}-addguest" style="${o2 ? 'display:none' : ''}">
      + Aggiungi secondo ospite
    </button>
    <div id="ef-${docId}-guest2wrap" style="${o2 ? '' : 'display:none'}">
      ${guestEditFields(docId, 2, o2 || {})}
    </div>
    <div class="form-error" id="ef-${docId}-error"></div>
    <div class="edit-actions">
      <button type="button" class="outline-btn" data-cancel-edit="${docId}">Annulla</button>
      <button type="button" class="btn-red" data-save-edit="${docId}">
        <span class="spinner" id="ef-${docId}-spinner"></span>
        <span id="ef-${docId}-savelabel">Salva modifiche</span>
      </button>
    </div>
  </div>`;
}

function bindEditForm(docId) {
  const doc = docsCache.find(d => d.id === docId);
  if (!doc) return;

  let editingSecondGuest = !!doc.ospiti?.[1];
  const g2FieldSuffixes = ['sesso', 'cognome', 'nome', 'dataNascita', 'cittadinanza',
    'luogoNascita', 'luogoResidenza', 'tipoDocumento', 'numeroDocumento', 'luogoRilascio'];

  const addBtn = $(`ef-${docId}-addguest`);
  const wrap = $(`ef-${docId}-guest2wrap`);

  addBtn?.addEventListener('click', () => {
    editingSecondGuest = true;
    wrap.style.display = 'block';
    addBtn.style.display = 'none';
    g2FieldSuffixes.forEach(f => { const el = $(`ef-${docId}-g2-${f}`); if (el) el.required = true; });
  });

  document.querySelector(`[data-remove-edit-guest="${docId}"]`)?.addEventListener('click', () => {
    editingSecondGuest = false;
    wrap.style.display = 'none';
    addBtn.style.display = 'flex';
    g2FieldSuffixes.forEach(f => { const el = $(`ef-${docId}-g2-${f}`); if (el) { el.required = false; el.value = ''; } });
    const fc = $(`ef-${docId}-g2-fatturaCheck`);
    if (fc) fc.checked = false;
    $(`ef-${docId}-g2-fatturaFields`)?.classList.remove('open');
  });

  ['g1', 'g2'].forEach(g => {
    $(`ef-${docId}-${g}-fatturaCheck`)?.addEventListener('change', e => {
      $(`ef-${docId}-${g}-fatturaFields`)?.classList.toggle('open', e.target.checked);
    });
  });

  document.querySelector(`[data-cancel-edit="${docId}"]`)?.addEventListener('click', () => {
    editingIds.delete(docId);
    render();
  });

  document.querySelector(`[data-save-edit="${docId}"]`)?.addEventListener('click', async () => {
    const collect = g => ({
      sesso: $(`ef-${docId}-${g}-sesso`).value,
      cognome: $(`ef-${docId}-${g}-cognome`).value.trim(),
      nome: $(`ef-${docId}-${g}-nome`).value.trim(),
      dataNascita: $(`ef-${docId}-${g}-dataNascita`).value,
      cittadinanza: $(`ef-${docId}-${g}-cittadinanza`).value.trim(),
      luogoNascita: $(`ef-${docId}-${g}-luogoNascita`).value.trim(),
      luogoResidenza: $(`ef-${docId}-${g}-luogoResidenza`).value.trim(),
      tipoDocumento: $(`ef-${docId}-${g}-tipoDocumento`).value,
      numeroDocumento: $(`ef-${docId}-${g}-numeroDocumento`).value.trim(),
      luogoRilascio: $(`ef-${docId}-${g}-luogoRilascio`).value.trim(),
      indirizzoResidenza: $(`ef-${docId}-${g}-fatturaCheck`).checked
        ? ($(`ef-${docId}-${g}-indirizzoResidenza`).value.trim() || null) : null,
      codiceFiscale: $(`ef-${docId}-${g}-fatturaCheck`).checked
        ? ($(`ef-${docId}-${g}-codiceFiscale`).value.trim() || null) : null
    });

    const checkIn = $(`ef-${docId}-checkin`).value;
    const checkOut = $(`ef-${docId}-checkout`).value;
    const ospiti = [collect('g1')];
    if (editingSecondGuest) ospiti.push(collect('g2'));

    const errorEl = $(`ef-${docId}-error`);
    const saveBtn = document.querySelector(`[data-save-edit="${docId}"]`);
    const spinner = $(`ef-${docId}-spinner`);
    const label = $(`ef-${docId}-savelabel`);

    saveBtn.disabled = true;
    spinner.classList.add('on');
    label.textContent = 'Salvataggio...';
    errorEl.style.display = 'none';

    try {
      const res = await apiFetch('/api/modifica', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: docId, checkIn, checkOut, ospiti })
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || 'Errore durante il salvataggio');
      }

      const target = docsCache.find(d => d.id === docId);
      if (target) {
        target.checkIn = checkIn;
        target.checkOut = checkOut;
        target.ospiti = ospiti;
      }
      editingIds.delete(docId);
      toast('✓ Modifiche salvate');
      render();
    } catch (err) {
      if (err.message !== 'session') {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
        saveBtn.disabled = false;
        spinner.classList.remove('on');
        label.textContent = 'Salva modifiche';
      }
    }
  });
}

function docCard(doc) {
  const isPending = doc.stato === 'pending';
  const badgeCls = isPending ? 'pending' : 'inserito';
  const badgeTxt = isPending ? 'Da inserire' : 'Inserito ✓';
  const isEditing = editingIds.has(doc.id);

  const primaryActionBtn = isPending
    ? `<button class="doc-action confirm" data-action="inserisci" data-id="${doc.id}">
        <span class="spinner-inline"></span>
        <span class="doc-action-label">✓ Segna come inserito in Ross1000</span>
      </button>`
    : `<button class="doc-action delete" data-action="elimina" data-id="${doc.id}">
        <span class="spinner-inline"></span>
        <span class="doc-action-label">🗑 Elimina documento</span>
      </button>`;

  const modificaBtn = `<button class="doc-action" data-action="modifica" data-id="${doc.id}">✏️ Modifica</button>`;

  const bodyHTML = isEditing
    ? editFormHTML(doc)
    : `
    <div class="doc-detail">${(doc.ospiti || []).map((o, i) => `
      <div class="guest-detail">
        <div class="guest-detail-title">Ospite ${i + 1}</div>
        ${guestFieldRows(o)}
      </div>`).join('')}</div>
    <div class="doc-actions">${primaryActionBtn}${modificaBtn}</div>`;

  return `
<div class="doc-card ${isEditing ? 'open' : ''}" id="card-${doc.id}">
  <div class="doc-header" data-toggle="${doc.id}">
    <div class="doc-icon">📋</div>
    <div class="doc-info">
      <div class="doc-name">${esc(guestNames(doc.ospiti || []))}</div>
      <div class="doc-date">${fmtDate(doc.checkIn)} → ${fmtDate(doc.checkOut)}</div>
    </div>
    <div class="doc-badge ${badgeCls}">${badgeTxt}</div>
    <div class="doc-chevron">▾</div>
  </div>
  ${bodyHTML}
</div>`;
}

function setActionBusy(btn, busy, label) {
  const spinner = btn.querySelector('.spinner-inline');
  const labelEl = btn.querySelector('.doc-action-label');
  btn.disabled = busy;
  spinner?.classList.toggle('on', busy);
  if (labelEl) {
    if (busy) {
      labelEl.dataset.original = labelEl.textContent;
      labelEl.textContent = label;
    } else if (labelEl.dataset.original) {
      labelEl.textContent = labelEl.dataset.original;
    }
  }
}

function bindActions() {
  document.querySelectorAll('[data-toggle]').forEach(header => {
    header.addEventListener('click', () => {
      $(`card-${header.dataset.toggle}`)?.classList.toggle('open');
    });
  });

  document.querySelectorAll('[data-action="inserisci"]').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const id = btn.dataset.id;
      const card = $(`card-${id}`);
      card?.classList.add('fading');
      setActionBusy(btn, true, 'Salvataggio...');
      try {
        const res = await apiFetch('/api/stato', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, stato: 'inserito' })
        });
        if (!res.ok) throw new Error();
        const doc = docsCache.find(d => d.id === id);
        if (doc) {
          doc.stato = 'inserito';
          doc.inseritoAt = new Date().toISOString();
        }
        toast('✓ Segnato come inserito');
        render();
      } catch (err) {
        if (err.message !== 'session') {
          toast('Errore — riprova');
          card?.classList.remove('fading');
          setActionBusy(btn, false);
        }
      }
    });
  });

  document.querySelectorAll('[data-action="elimina"]').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      if (!confirm('Eliminare definitivamente questo check-in?')) return;
      const id = btn.dataset.id;
      const card = $(`card-${id}`);
      card?.classList.add('fading');
      setActionBusy(btn, true, 'Eliminazione...');
      try {
        const res = await apiFetch(`/api/elimina?id=${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error();
        const idx = docsCache.findIndex(d => d.id === id);
        if (idx !== -1) docsCache.splice(idx, 1);
        toast('Check-in eliminato');
        render();
      } catch (err) {
        if (err.message !== 'session') {
          toast('Errore — riprova');
          card?.classList.remove('fading');
          setActionBusy(btn, false);
        }
      }
    });
  });

  document.querySelectorAll('[data-action="modifica"]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      editingIds.add(btn.dataset.id);
      render();
    });
  });

  editingIds.forEach(id => bindEditForm(id));
}

// ── INSERITI TOGGLE ──

$('inseriti-toggle').addEventListener('click', () => {
  $('inseriti-list').classList.toggle('open');
  $('inseriti-toggle').classList.toggle('open');
});
</script>
