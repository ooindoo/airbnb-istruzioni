<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="robots" content="noindex, nofollow, noarchive"/>
<title>Gestione · Suite in Centro</title>
<style>
:root {
  --red: #FF385C;
  --black: #222222;
  --gray: #717171;
  --gray-light: #B0B0B0;
  --border: #DDDDDD;
  --border-inner: #EBEBEB;
  --surface: #F7F7F7;
  --white: #FFFFFF;
  --radius: 12px;
  --radius-sm: 8px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  color: var(--black);
  background: var(--surface);
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
}

/* ── LOGIN ── */
#login-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100dvh;
  padding: 32px 24px;
  background: var(--white);
}
.login-logo { font-size: 40px; margin-bottom: 10px; }
.login-title { font-size: 20px; font-weight: 700; color: var(--black); }
.login-sub { font-size: 14px; color: var(--gray); margin-top: 4px; margin-bottom: 32px; }
.login-form { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 12px; }

.field-input {
  width: 100%;
  padding: 14px 16px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font: inherit;
  font-size: 16px;
  background: var(--white);
  color: var(--black);
  -webkit-appearance: none;
  transition: border-color 0.15s;
}
.field-input:focus { outline: none; border-color: var(--black); }
.field-input::placeholder { color: var(--gray-light); }

.btn-black {
  width: 100%;
  padding: 14px;
  background: var(--black);
  color: var(--white);
  border: none;
  border-radius: var(--radius-sm);
  font: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  min-height: 52px;
  transition: opacity 0.15s;
}
.btn-black:active { opacity: 0.85; }
.btn-black:disabled { opacity: 0.45; cursor: default; }

.btn-red {
  width: 100%;
  padding: 14px;
  background: var(--red);
  color: var(--white);
  border: none;
  border-radius: var(--radius-sm);
  font: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: opacity 0.15s;
}
.btn-red:active { opacity: 0.85; }
.btn-red:disabled { opacity: 0.45; cursor: default; }

.login-error {
  color: var(--red);
  font-size: 14px;
  text-align: center;
  min-height: 18px;
}

/* ── APP ── */
#app-screen { display: none; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.topbar-title { font-size: 15px; font-weight: 700; line-height: 1.2; }
.topbar-sub { font-size: 12px; color: var(--gray); }
.logout-btn {
  background: none;
  border: none;
  font: inherit;
  font-size: 13px;
  color: var(--gray);
  cursor: pointer;
  padding: 8px 4px;
  flex-shrink: 0;
}
.logout-btn:active { color: var(--red); }

.content {
  max-width: 680px;
  margin: 0 auto;
  padding: 16px 16px 48px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ── BADGE ── */
.summary-badge {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.badge-icon { font-size: 30px; flex-shrink: 0; line-height: 1; }
.badge-body { flex: 1; min-width: 0; }
.badge-count { font-size: 22px; font-weight: 800; color: var(--red); line-height: 1.2; }
.badge-label { font-size: 13px; color: var(--gray); margin-top: 2px; }
.badge-ok .badge-count { color: #2A7A45; }

/* ── CARD ── */
.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

.section-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--gray);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 14px;
}

/* ── UPLOAD ── */
.upload-card {
  background: var(--white);
  border: 1.5px dashed var(--border);
  border-radius: var(--radius);
  padding: 20px 16px;
}
.upload-fields { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.field-label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 5px; }

.field-sm {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font: inherit;
  font-size: 15px;
  background: var(--surface);
  color: var(--black);
  -webkit-appearance: none;
}
.field-sm:focus { outline: none; border-color: var(--black); background: var(--white); }

#file-input { display: none; }
.file-btn {
  width: 100%;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1.5px solid var(--black);
  border-radius: var(--radius-sm);
  background: var(--white);
  color: var(--black);
  font: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s;
}
.file-btn:active { background: var(--surface); }

.file-preview {
  width: 100%;
  max-height: 220px;
  object-fit: cover;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  margin-top: 10px;
  display: none;
}
.upload-error { font-size: 13px; color: var(--red); margin-top: 8px; display: none; }
.upload-submit { margin-top: 12px; }

/* ── SPINNER ── */
.spinner {
  width: 18px;
  height: 18px;
  border: 2.5px solid rgba(255,255,255,0.4);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: none;
}
.spinner.on { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── DOC CARD ── */
.doc-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: opacity 0.2s;
}
.doc-card.fading { opacity: 0.4; pointer-events: none; }

.doc-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
}
.doc-thumb {
  width: 54px;
  height: 54px;
  border-radius: 8px;
  object-fit: cover;
  flex-shrink: 0;
  background: var(--surface);
  border: 1px solid var(--border-inner);
}
.doc-thumb-ph {
  width: 54px;
  height: 54px;
  border-radius: 8px;
  background: var(--surface);
  border: 1px solid var(--border-inner);
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
}
.doc-info { flex: 1; min-width: 0; }
.doc-name {
  font-size: 15px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.doc-date { font-size: 13px; color: var(--gray); margin-top: 2px; }
.doc-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 999px;
  flex-shrink: 0;
  white-space: nowrap;
}
.doc-badge.pending { background: #FFF0F3; color: var(--red); }
.doc-badge.inviato { background: #EDF8F1; color: #2A7A45; }

.doc-actions {
  display: flex;
  border-top: 1px solid var(--border-inner);
}
.doc-action {
  flex: 1;
  padding: 13px 8px;
  background: none;
  border: none;
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: background 0.12s;
}
.doc-action:active { background: var(--surface); }
.doc-action + .doc-action { border-left: 1px solid var(--border-inner); }
.doc-action.confirm { color: #2A7A45; }
.doc-action.delete { color: var(--red); }
.doc-action:disabled { opacity: 0.45; cursor: default; }

/* ── INVIATI TOGGLE ── */
.inviati-toggle {
  background: none;
  border: none;
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  color: var(--gray);
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  padding: 6px 0;
  width: 100%;
  text-align: left;
}
.chv { display: inline-block; transition: transform 0.18s; }
.inviati-toggle.open .chv { transform: rotate(180deg); }
#inviati-list { display: none; flex-direction: column; gap: 10px; margin-top: 10px; }
#inviati-list.open { display: flex; }

/* ── EMPTY STATE ── */
.empty {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 40px 20px;
  text-align: center;
  color: var(--gray);
}
.empty-icon { font-size: 36px; margin-bottom: 10px; }
.empty p { font-size: 14px; line-height: 1.6; }

/* ── TOAST ── */
#toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(6px);
  background: var(--black);
  color: var(--white);
  border-radius: 999px;
  padding: 9px 20px;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s, transform 0.18s;
  z-index: 200;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="login-screen">
  <div class="login-logo">🏠</div>
  <div class="login-title">Gestione Suite</div>
  <div class="login-sub">Area riservata host</div>
  <form class="login-form" id="login-form">
    <input type="password" class="field-input" id="login-pw"
      placeholder="Password" autocomplete="current-password" autocapitalize="none"/>
    <button type="submit" class="btn-black" id="login-btn">Accedi</button>
    <div class="login-error" id="login-error"></div>
  </form>
</div>

<!-- ── APP ── -->
<div id="app-screen">
  <header class="topbar">
    <div>
      <div class="topbar-title">Documenti ospiti</div>
      <div class="topbar-sub">Suite in Centro · Treviso</div>
    </div>
    <button class="logout-btn" id="logout-btn">Esci</button>
  </header>

  <div class="content">

    <!-- Badge riepilogo -->
    <div class="summary-badge" id="badge">
      <div class="badge-icon" id="badge-icon">⚠️</div>
      <div class="badge-body">
        <div class="badge-count" id="badge-count">—</div>
        <div class="badge-label" id="badge-label">da inviare ad Alloggiati Web</div>
      </div>
    </div>

    <!-- Carica nuovo documento -->
    <div class="upload-card">
      <div class="section-label">Nuovo documento</div>
      <form id="upload-form" enctype="multipart/form-data">
        <div class="upload-fields">
          <div>
            <label class="field-label" for="f-ospite">Nome ospite</label>
            <input type="text" id="f-ospite" name="ospite" class="field-sm"
              placeholder="es. Mario Rossi" autocapitalize="words"/>
          </div>
          <div>
            <label class="field-label" for="f-checkin">Data check-in</label>
            <input type="date" id="f-checkin" name="checkIn" class="field-sm"/>
          </div>
        </div>

        <input type="file" id="file-input" name="foto" accept="image/*" capture="environment"/>
        <button type="button" class="file-btn" id="file-btn">
          📷&nbsp; Scatta / scegli foto documento
        </button>
        <img id="file-preview" class="file-preview" alt="Anteprima"/>

        <div class="upload-error" id="upload-error"></div>

        <button type="submit" class="btn-red upload-submit" id="upload-btn" disabled>
          <span class="spinner" id="upload-spinner"></span>
          <span id="upload-label">Carica documento</span>
        </button>
      </form>
    </div>

    <!-- Lista da inviare -->
    <div id="pending-list"></div>

    <!-- Sezione inviati (nascosta se vuota) -->
    <div id="inviati-section" style="display:none">
      <button class="inviati-toggle" id="inviati-toggle">
        Già inviati ad Alloggiati Web <span class="chv">▾</span>
      </button>
      <div id="inviati-list"></div>
    </div>

  </div>
</div>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let toastTimer;

function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso.length === 10 ? iso + 'T12:00:00' : iso);
  return d.toLocaleDateString('it-IT', { day: '2-digit', month: 'short', year: 'numeric' });
}

function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── AUTH ──

async function apiFetch(url, opts = {}) {
  const res = await fetch(url, opts);
  if (res.status === 401 && url !== '/api/auth') {
    showLogin();
    throw new Error('session');
  }
  return res;
}

async function checkSession() {
  const res = await fetch('/api/auth');
  return res.ok;
}

async function doLogin(password) {
  const res = await fetch('/api/auth', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password })
  });
  return res.ok;
}

// ── BOOTSTRAP ──

(async () => {
  if (await checkSession()) showApp();
  else showLogin();
})();

function showLogin() {
  $('login-screen').style.display = 'flex';
  $('app-screen').style.display = 'none';
  setTimeout(() => $('login-pw').focus(), 80);
}

function showApp() {
  $('login-screen').style.display = 'none';
  $('app-screen').style.display = 'block';
  $('f-checkin').value = new Date().toISOString().split('T')[0];
  loadDocs();
}

// ── LOGIN ──

$('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = $('login-pw').value;
  if (!pw) return;

  $('login-btn').disabled = true;
  $('login-btn').textContent = '…';
  $('login-error').textContent = '';

  const ok = await doLogin(pw);
  if (ok) {
    showApp();
  } else {
    $('login-error').textContent = 'Password errata. Riprova.';
    $('login-btn').disabled = false;
    $('login-btn').textContent = 'Accedi';
    $('login-pw').select();
  }
});

// ── LOGOUT ──

$('logout-btn').addEventListener('click', () => {
  document.cookie = 'gestione_auth=; Max-Age=0; Path=/';
  $('login-pw').value = '';
  showLogin();
});

// ── FILE PICKER ──

$('file-btn').addEventListener('click', () => $('file-input').click());

$('file-input').addEventListener('change', () => {
  const file = $('file-input').files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = ev => {
    $('file-preview').src = ev.target.result;
    $('file-preview').style.display = 'block';
  };
  reader.readAsDataURL(file);
  $('upload-btn').disabled = false;
});

// ── UPLOAD ──

$('upload-form').addEventListener('submit', async e => {
  e.preventDefault();
  const file = $('file-input').files[0];
  if (!file) return;

  // Compress client-side if > 2 MB
  let uploadFile = file;
  if (file.size > 2 * 1024 * 1024) {
    try { uploadFile = await compressImage(file, 1600, 0.82); } catch { /* keep original */ }
  }

  setUploadBusy(true);
  $('upload-error').style.display = 'none';

  try {
    const fd = new FormData();
    fd.append('foto', uploadFile, uploadFile.name || 'documento.jpg');
    fd.append('ospite', $('f-ospite').value.trim());
    fd.append('checkIn', $('f-checkin').value);

    const res = await apiFetch('/api/upload', { method: 'POST', body: fd });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || 'Errore durante il caricamento');
    }

    toast('✓ Documento caricato');
    e.target.reset();
    $('file-preview').style.display = 'none';
    $('upload-btn').disabled = true;
    $('f-checkin').value = new Date().toISOString().split('T')[0];
    await loadDocs();
  } catch (err) {
    if (err.message !== 'session') {
      $('upload-error').textContent = err.message;
      $('upload-error').style.display = 'block';
    }
  } finally {
    setUploadBusy(false);
  }
});

function setUploadBusy(busy) {
  $('upload-btn').disabled = busy;
  $('upload-spinner').classList.toggle('on', busy);
  $('upload-label').textContent = busy ? 'Caricamento…' : 'Carica documento';
}

function compressImage(file, maxPx, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.width, h = img.height;
      if (w > maxPx || h > maxPx) {
        if (w > h) { h = Math.round(h * maxPx / w); w = maxPx; }
        else { w = Math.round(w * maxPx / h); h = maxPx; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(blob => blob ? resolve(blob) : reject(), 'image/jpeg', quality);
    };
    img.onerror = reject;
    img.src = url;
  });
}

// ── DOCS ──

async function loadDocs() {
  try {
    const res = await apiFetch('/api/documenti');
    if (!res.ok) return;
    render(await res.json());
  } catch {}
}

function render(docs) {
  const pending = docs.filter(d => d.stato === 'pending');
  const inviati = docs.filter(d => d.stato === 'inviato');

  // Badge
  const badge = $('badge');
  if (pending.length === 0) {
    badge.classList.add('badge-ok');
    $('badge-icon').textContent = '✅';
    $('badge-count').textContent = 'Tutto in ordine';
    $('badge-label').textContent = 'nessun documento in attesa';
  } else {
    badge.classList.remove('badge-ok');
    $('badge-icon').textContent = '⚠️';
    $('badge-count').textContent = pending.length === 1
      ? '1 documento' : `${pending.length} documenti`;
    $('badge-label').textContent = 'da inviare ad Alloggiati Web';
  }

  // Pending list
  const pendingList = $('pending-list');
  if (pending.length === 0) {
    if (docs.length === 0) {
      pendingList.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🪪</div>
          <p>Nessun documento caricato.<br/>Usa il form sopra per aggiungere il primo.</p>
        </div>`;
    } else {
      pendingList.innerHTML = '';
    }
  } else {
    pendingList.innerHTML = pending.map(docCard).join('');
  }

  // Inviati section
  const sec = $('inviati-section');
  const list = $('inviati-list');
  if (inviati.length === 0) {
    sec.style.display = 'none';
  } else {
    sec.style.display = 'block';
    list.innerHTML = inviati.map(docCard).join('');
  }

  bindActions();
}

function docCard(doc) {
  const isPending = doc.stato === 'pending';
  const badgeCls = isPending ? 'pending' : 'inviato';
  const badgeTxt = isPending ? 'Da inviare' : 'Inviato ✓';

  const actionBtn = isPending
    ? `<button class="doc-action confirm" data-action="invia" data-id="${doc.id}">✓ Segna come inviato</button>`
    : `<button class="doc-action delete" data-action="elimina" data-id="${doc.id}">🗑 Elimina documento</button>`;

  return `
<div class="doc-card" id="card-${doc.id}">
  <div class="doc-header">
    <img class="doc-thumb" src="/api/foto?id=${doc.id}" alt="Documento"
      onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
    <div class="doc-thumb-ph">🪪</div>
    <div class="doc-info">
      <div class="doc-name">${esc(doc.ospite || 'Ospite non specificato')}</div>
      <div class="doc-date">Check-in: ${fmtDate(doc.checkIn)}</div>
    </div>
    <div class="doc-badge ${badgeCls}">${badgeTxt}</div>
  </div>
  <div class="doc-actions">${actionBtn}</div>
</div>`;
}

function bindActions() {
  document.querySelectorAll('[data-action="invia"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      $(`card-${id}`).classList.add('fading');
      try {
        const res = await apiFetch('/api/stato', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, stato: 'inviato' })
        });
        if (!res.ok) throw new Error();
        toast('✓ Segnato come inviato');
        await loadDocs();
      } catch (err) {
        if (err.message !== 'session') {
          toast('Errore — riprova');
          $(`card-${id}`)?.classList.remove('fading');
        }
      }
    });
  });

  document.querySelectorAll('[data-action="elimina"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Eliminare definitivamente questo documento?')) return;
      const id = btn.dataset.id;
      $(`card-${id}`).classList.add('fading');
      try {
        const res = await apiFetch(`/api/elimina?id=${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error();
        toast('Documento eliminato');
        await loadDocs();
      } catch (err) {
        if (err.message !== 'session') {
          toast('Errore — riprova');
          $(`card-${id}`)?.classList.remove('fading');
        }
      }
    });
  });
}

// ── INVIATI TOGGLE ──

$('inviati-toggle').addEventListener('click', () => {
  $('inviati-list').classList.toggle('open');
  $('inviati-toggle').classList.toggle('open');
});
</script>
</body>
