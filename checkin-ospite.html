<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="robots" content="noindex, nofollow, noarchive"/>
<title>Check-in ospiti · Suite in Centro</title>
<style>
:root {
  --red: #FF385C;
  --black: #222222;
  --gray: #717171;
  --gray-light: #B0B0B0;
  --border: #DDDDDD;
  --border-inner: #EBEBEB;
  --surface: #F7F7F7;
  --white: #FFFFFF;
  --radius: 12px;
  --radius-sm: 8px;
  --topbar-h: 56px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  color: var(--black);
  background: var(--surface);
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
}

/* ── TOPBAR (identica a index.html) ── */
.icon {
  display: inline-block;
  flex-shrink: 0;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
  vertical-align: middle;
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: var(--topbar-h);
}
.lang-sw {
  display: flex;
  align-items: center;
  gap: 2px;
  background: var(--surface);
  border-radius: 999px;
  padding: 4px;
}
.lb {
  background: none;
  border: none;
  font: inherit;
  font-weight: 600;
  font-size: 13px;
  color: var(--gray);
  padding: 6px 12px;
  border-radius: 999px;
  cursor: pointer;
  min-width: 44px;
  min-height: 36px;
  line-height: 1;
}
.lb.active {
  background: var(--black);
  color: var(--white);
}
.print-btn {
  width: 44px;
  height: 44px;
  border: none;
  background: var(--surface);
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--black);
  flex-shrink: 0;
}
.print-btn:hover { background: var(--border); }

.content {
  max-width: 560px;
  margin: 0 auto;
  padding: 24px 16px 48px;
}

.page-header { text-align: center; margin-bottom: 20px; }
.page-title { font-size: 20px; font-weight: 800; }
.page-sub { font-size: 13px; color: var(--gray); margin-top: 4px; }

/* ── STATO PAGINA (loading / invalido / grazie) ── */
.status-screen {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 48px 24px;
  text-align: center;
  display: none;
}
.status-screen.show { display: block; }
.status-icon { font-size: 40px; margin-bottom: 14px; }
.status-title { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
.status-text { font-size: 14px; color: var(--gray); line-height: 1.6; }

/* ── FORM ── */
.form-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 16px;
  display: none;
}
.form-card.show { display: block; }

.form-row { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.field-label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 5px; }

.field-sm, select.field-sm {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font: inherit;
  font-size: 15px;
  background: var(--surface);
  color: var(--black);
  -webkit-appearance: none;
}
.field-sm:focus { outline: none; border-color: var(--black); background: var(--white); }

.autocomplete-wrap { position: relative; }
.autocomplete-list {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  max-height: 190px;
  overflow-y: auto;
  z-index: 30;
  display: none;
  box-shadow: 0 4px 16px rgba(0,0,0,0.1);
}
.autocomplete-list.open { display: block; }
.autocomplete-item {
  padding: 10px 12px;
  font-size: 14px;
  cursor: pointer;
}
.autocomplete-item:active, .autocomplete-item.active { background: var(--surface); }

.guest-block {
  border-top: 1px solid var(--border-inner);
  padding-top: 14px;
  margin-top: 4px;
}
.guest-title { font-size: 13px; font-weight: 700; color: var(--black); margin-bottom: 12px; }

.mini-divider {
  font-size: 11px;
  font-weight: 700;
  color: var(--gray);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin: 14px 0 8px;
  padding-top: 12px;
  border-top: 1px dashed var(--border-inner);
}

.checkbox-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  font-weight: 600;
  margin-top: 2px;
  padding: 10px 4px;
  cursor: pointer;
  border-radius: var(--radius-sm);
}
.checkbox-row:active { background: var(--surface); }
.checkbox-row input[type="checkbox"] { width: 18px; height: 18px; flex-shrink: 0; }

.fattura-fields { display: none; flex-direction: column; gap: 10px; margin-top: 10px; }
.fattura-fields.open { display: flex; }

.outline-btn {
  width: 100%;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1.5px solid var(--black);
  border-radius: var(--radius-sm);
  background: var(--white);
  color: var(--black);
  font: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s;
  margin-top: 4px;
}
.outline-btn:active { background: var(--surface); }

.remove-guest-btn {
  background: none;
  border: none;
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  color: var(--gray);
  cursor: pointer;
  padding: 10px 0 2px;
  text-align: left;
}
.remove-guest-btn:active { color: var(--red); }

.form-error { font-size: 13px; color: var(--red); margin-top: 8px; display: none; }
.form-submit { margin-top: 16px; }

.btn-red {
  width: 100%;
  padding: 14px;
  background: var(--red);
  color: var(--white);
  border: none;
  border-radius: var(--radius-sm);
  font: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: opacity 0.15s;
}
.btn-red:active { opacity: 0.85; }
.btn-red:disabled { opacity: 0.45; cursor: default; }

.spinner {
  width: 18px;
  height: 18px;
  border: 2.5px solid rgba(255,255,255,0.4);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: none;
}
.spinner.on { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V4h10v5"/><rect x="5" y="9" width="14" height="7" rx="1"/><path d="M7 16v4h10v-4"/></symbol>
</svg>

<header class="topbar">

    <button class="lb active" data-lang="it">IT</button>
    <button class="lb" data-lang="en">EN</button>
    <button class="lb" data-lang="es">ES</button>
    <button class="lb" data-lang="de">DE</button>
    <button class="lb" data-lang="fr">FR</button>

  <button class="print-btn" id="printBtn" aria-label="Stampa">

<div class="content">

        </div>
        <div class="form-row-2">
          <div>

          </div>
          <div>
            <label class="field-label" for="g1-nome" data-t="field.nome">Nome</label>
            <input type="text" id="g1-nome" class="field-sm" placeholder="es. Mario" data-t-placeholder="ph.nome" autocapitalize="words" autocomplete="section-ospite1 given-name" required/>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label class="field-label" for="g1-dataNascita" data-t="field.dataNascita">Data di nascita</label>
            <input type="date" id="g1-dataNascita" class="field-sm" autocomplete="section-ospite1 bday" required/>
          </div>

        <div class="form-row">
          <div class="autocomplete-wrap">

            <div class="autocomplete-list" id="g1-cittadinanza-list"></div>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label class="field-label" for="g1-luogoNascita" data-t="field.luogoNascita">Stato/luogo di nascita</label>
            <input type="text" id="g1-luogoNascita" class="field-sm" placeholder="es. Treviso" data-t-placeholder="ph.luogoNascita" required/>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label class="field-label" for="g1-luogoResidenza" data-t="field.luogoResidenza">Stato/luogo di residenza</label>
            <input type="text" id="g1-luogoResidenza" class="field-sm" placeholder="es. Milano" data-t-placeholder="ph.luogoResidenza" required/>
          </div>
        </div>
        <div class="form-row-2">
          <div>
            <label class="field-label" for="g1-tipoDocumento" data-t="field.tipoDocumento">Tipo documento</label>
            <select id="g1-tipoDocumento" class="field-sm" required>
              <option value="" disabled selected data-t="field.select">Seleziona</option>
              <option value="Carta d'identità" data-t="doc.ci">Carta d'identità</option>
              <option value="Passaporto" data-t="doc.pp">Passaporto</option>
            </select>
          </div>
          <div>
            <label class="field-label" for="g1-numeroDocumento" data-t="field.numeroDocumento">Numero documento</label>
            <input type="text" id="g1-numeroDocumento" class="field-sm" placeholder="es. AB1234567" data-t-placeholder="ph.numeroDocumento" required/>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label class="field-label" for="g1-luogoRilascio" data-t="field.luogoRilascio">Stato/luogo di rilascio</label>
            <input type="text" id="g1-luogoRilascio" class="field-sm" placeholder="es. Treviso" data-t-placeholder="ph.luogoRilascio" required/>
          </div>
        </div>

        <label class="checkbox-row">
          <input type="checkbox" id="g1-fatturaCheck"/>
          <span data-t="field.fatturaCheck">Sei residente in Italia?</span>
        </label>
        <div class="fattura-fields" id="g1-fatturaFields">
          <div>
            <label class="field-label" for="g1-indirizzoResidenza" data-t="field.indirizzoResidenza">Indirizzo di residenza completo</label>
            <input type="text" id="g1-indirizzoResidenza" class="field-sm" placeholder="Via, numero civico, CAP, città" data-t-placeholder="ph.indirizzoResidenza" autocomplete="section-ospite1 street-address"/>
          </div>
          <div>
            <label class="field-label" for="g1-codiceFiscale" data-t="field.codiceFiscale">Codice Fiscale</label>
            <input type="text" id="g1-codiceFiscale" class="field-sm" placeholder="es. RSSMRA80A01L407K" autocapitalize="characters"/>
          </div>
        </div>
      </div>

      <button type="button" class="outline-btn" id="add-guest-btn" data-t="btn.addGuest">
        + Aggiungi secondo ospite
      </button>

      <!-- Ospite 2 (nascosto finché non aggiunto) -->
      <div class="guest-block" id="guest-2" style="display:none">
        <div class="guest-title" data-t="guest.2">Ospite 2</div>

        <div class="form-row">
          <div>
            <label class="field-label" for="g2-sesso" data-t="field.sesso">Sesso</label>
            <select id="g2-sesso" class="field-sm" autocomplete="section-ospite2 sex">

              <option value="M">M</option>
              <option value="F">F</option>

          <div>
            <label class="field-label" for="g2-nome" data-t="field.nome">Nome</label>

          <div>

        </div>
        <div class="form-row">

          </div>
        </div>
        <div class="form-row">
          <div>
            <label class="field-label" for="g2-luogoNascita" data-t="field.luogoNascita">Stato/luogo di nascita</label>
            <input type="text" id="g2-luogoNascita" class="field-sm" placeholder="es. Treviso" data-t-placeholder="ph.luogoNascita"/>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label class="field-label" for="g2-luogoResidenza" data-t="field.luogoResidenza">Stato/luogo di residenza</label>
            <input type="text" id="g2-luogoResidenza" class="field-sm" placeholder="es. Milano" data-t-placeholder="ph.luogoResidenza"/>

        <div class="form-row-2">
          <div>
            <label class="field-label" for="g2-tipoDocumento" data-t="field.tipoDocumento">Tipo documento</label>

              <option value="" disabled selected data-t="field.select">Seleziona</option>
              <option value="Carta d'identità" data-t="doc.ci">Carta d'identità</option>
              <option value="Passaporto" data-t="doc.pp">Passaporto</option>
            </select>
          </div>
          <div>
            <label class="field-label" for="g2-numeroDocumento" data-t="field.numeroDocumento">Numero documento</label>

        <div class="form-row">
          <div>
            <label class="field-label" for="g2-luogoRilascio" data-t="field.luogoRilascio">Stato/luogo di rilascio</label>

          </div>
        </div>

        <label class="checkbox-row">
          <input type="checkbox" id="g2-fatturaCheck"/>
          <span data-t="field.fatturaCheck">Sei residente in Italia?</span>
        </label>
        <div class="fattura-fields" id="g2-fatturaFields">
          <div>
            <label class="field-label" for="g2-indirizzoResidenza" data-t="field.indirizzoResidenza">Indirizzo di residenza completo</label>
            <input type="text" id="g2-indirizzoResidenza" class="field-sm" placeholder="Via, numero civico, CAP, città" data-t-placeholder="ph.indirizzoResidenza" autocomplete="section-ospite2 street-address"/>

          <div>
            <label class="field-label" for="g2-codiceFiscale" data-t="field.codiceFiscale">Codice Fiscale</label>
            <input type="text" id="g2-codiceFiscale" class="field-sm" placeholder="es. RSSMRA80A01L407K" autocapitalize="characters"/>
          </div>

        <button type="button" class="remove-guest-btn" id="remove-guest-btn" data-t="btn.removeGuest">− Rimuovi secondo ospite</button>

      <div class="form-error" id="form-error"></div>

      <button type="submit" class="btn-red form-submit" id="checkin-btn">
        <span class="spinner" id="checkin-spinner"></span>
        <span id="checkin-label" data-t="btn.submit">Invia i tuoi dati</span>
      </button>
    </form>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const codice = new URLSearchParams(location.search).get('codice');

// ── TRADUZIONI ──
// Stesso meccanismo di main.js (index.html): oggetto T per lingua, attributo
// data-t per il testo, stessa chiave localStorage 'lang' (la preferenza
// lingua è quindi condivisa con index.html). Non importiamo main.js
// direttamente: contiene logica specifica di index.html (accordion, tabbar,
// carousel) non applicabile qui. Estendiamo il pattern con data-t-placeholder
// per tradurre anche i placeholder.

const T = {
  it: {
    "page.title": "Check-in ospiti",
    "status.loading": "Verifica in corso…",
    "status.invalid.title": "Link non valido",
    "status.invalid.text1": "Questo link non è valido o è scaduto.",
    "status.invalid.text2": "Contatta la struttura per riceverne uno nuovo.",

    "status.thanks.text": "I tuoi dati sono stati ricevuti correttamente.",
    "field.checkin": "Data arrivo", "field.checkout": "Data partenza",
    "guest.label": "Ospite", "guest.1": "Ospite 1", "guest.2": "Ospite 2",
    "field.select": "Seleziona",
    "field.sesso": "Sesso", "field.cognome": "Cognome", "field.nome": "Nome",
    "field.dataNascita": "Data di nascita", "field.cittadinanza": "Cittadinanza",
    "field.luogoNascita": "Stato/luogo di nascita", "field.luogoResidenza": "Stato/luogo di residenza",
    "field.tipoDocumento": "Tipo documento", "field.numeroDocumento": "Numero documento",
    "field.luogoRilascio": "Stato/luogo di rilascio", "field.fatturaCheck": "Sei residente in Italia?",
    "field.indirizzoResidenza": "Indirizzo di residenza completo", "field.codiceFiscale": "Codice Fiscale",
    "doc.ci": "Carta d'identità", "doc.pp": "Passaporto",
    "btn.addGuest": "+ Aggiungi secondo ospite", "btn.removeGuest": "− Rimuovi secondo ospite",
    "btn.submit": "Invia i tuoi dati", "btn.submitBusy": "Invio in corso...",
    "ph.cognome": "es. Rossi", "ph.nome": "es. Mario", "ph.cittadinanza": "es. Italia",
    "ph.luogoNascita": "es. Treviso", "ph.luogoResidenza": "es. Milano",

let lang = 'it';
const savedLang = localStorage.getItem('lang');
if (savedLang && T[savedLang]) lang = savedLang;

function applyLang(l) {
  if (!T[l]) return;
  lang = l;
  document.documentElement.lang = l;
  document.querySelectorAll('[data-t]').forEach(el => {
    const k = el.getAttribute('data-t');
    if (T[l][k] !== undefined) el.textContent = T[l][k];
  });
  document.querySelectorAll('[data-t-placeholder]').forEach(el => {
    const k = el.getAttribute('data-t-placeholder');
    if (T[l][k] !== undefined) el.placeholder = T[l][k];
  });
  document.querySelectorAll('.lb').forEach(b => {
    b.classList.toggle('active', b.getAttribute('data-lang') === l);
  });
  localStorage.setItem('lang', l);
  setCheckinBusy(checkinBusy);

  // Se un paese è già stato selezionato dai suggerimenti, aggiorna anche
  // il testo mostrato nella nuova lingua (il valore canonico salvato non cambia).
  Object.keys(cittadinanzaCanonical).forEach(inputId => {
    const idx = PAESI.it.indexOf(cittadinanzaCanonical[inputId]);
    if (idx !== -1 && $(inputId)) $(inputId).value = (PAESI[l] || PAESI.it)[idx];
  });
}

document.querySelectorAll('.lb').forEach(b => {
  b.addEventListener('click', () => applyLang(b.getAttribute('data-lang')));
});

// ── STAMPA ──
document.getElementById('printBtn').addEventListener('click', () => window.print());

function showScreen(id) {
  ['loading-screen', 'invalid-screen', 'thanks-screen', 'form-card'].forEach(s => {
    $(s).classList.toggle('show', s === id);
  });
}

(async () => {
  showScreen('loading-screen');

  if (!codice) {
    showScreen('invalid-screen');
    return;
  }

  try {
    const res = await fetch(`/api/verifica-codice?codice=${encodeURIComponent(codice)}`);
    const data = await res.json();
    if (data.ok) {
      $('ci-checkin').value = new Date().toISOString().split('T')[0];
      showScreen('form-card');
    } else {
      showScreen('invalid-screen');
    }
  } catch {
    showScreen('invalid-screen');
  }
})();

// Traccia, per ogni input Cittadinanza, il valore italiano canonico
// selezionato dalla lista suggerimenti — è quello che viene poi inviato
// al server, indipendentemente dalla lingua mostrata.
const cittadinanzaCanonical = {};

function setupCountryAutocomplete(prefix) {
  const input = $(`${prefix}-cittadinanza`);
  const list = $(`${prefix}-cittadinanza-list`);
  const inputId = `${prefix}-cittadinanza`;

  function close() {
    list.classList.remove('open');
    list.innerHTML = '';
  }

  function renderMatches(query) {
    const q = query.trim().toLowerCase();
    if (!q) { close(); return; }
    const names = PAESI[lang] || PAESI.it;
    const idxMatches = [];
    names.forEach((name, i) => { if (name.toLowerCase().includes(q)) idxMatches.push(i); });
    const shown = idxMatches.slice(0, 8);
    if (!shown.length) { close(); return; }
    list.innerHTML = shown.map(i => `<div class="autocomplete-item" data-idx="${i}">${names[i]}</div>`).join('');
    list.classList.add('open');
  }

  input.addEventListener('input', () => {
    delete cittadinanzaCanonical[inputId];
    renderMatches(input.value);
  });
  input.addEventListener('focus', () => { if (input.value.trim()) renderMatches(input.value); });
  input.addEventListener('blur', () => setTimeout(close, 150));

  // mousedown (non click): scatta prima del blur, altrimenti la lista si
  // chiuderebbe prima che il click sull'elemento venga registrato.
  list.addEventListener('mousedown', e => {
    const item = e.target.closest('.autocomplete-item');
    if (!item) return;
    const idx = Number(item.dataset.idx);
    input.value = (PAESI[lang] || PAESI.it)[idx];
    cittadinanzaCanonical[inputId] = PAESI.it[idx];
    close();
  });
}

['g1', 'g2'].forEach(setupCountryAutocomplete);

// ── VALIDAZIONE ──
// Controllo esplicito indipendente dagli attributi "required": alcuni
// browser/webview non bloccano il submit in modo affidabile quando il
// form passa da nascosto a visibile dinamicamente.

const ROSS1000_FIELD_KEYS = ['sesso', 'cognome', 'nome', 'dataNascita', 'cittadinanza',
  'luogoNascita', 'luogoResidenza', 'tipoDocumento', 'numeroDocumento', 'luogoRilascio'];

function guestLabel(prefix) {
  return T[lang][prefix === 'g1' ? 'guest.1' : 'guest.2'];
}

function validateGuest(prefix) {
  for (const field of ROSS1000_FIELD_KEYS) {
    const el = $(`${prefix}-${field}`);
    if (!el.value || !el.value.trim()) {
      return T[lang]['err.required']
        .replace('{guest}', guestLabel(prefix))
        .replace('{field}', T[lang][`field.${field}`]);
    }
  }
  if ($(`${prefix}-fatturaCheck`).checked) {
    const indirizzo = $(`${prefix}-indirizzoResidenza`).value.trim();
    const cf = $(`${prefix}-codiceFiscale`).value.trim();
    if (!indirizzo || !cf) {
      return T[lang]['err.fatturaIncomplete'].replace('{guest}', guestLabel(prefix));
    }
  }
  return null;
}

function validateForm() {
  if (!$('ci-checkin').value) return T[lang]['err.checkinMissing'];
  if (!$('ci-checkout').value) return T[lang]['err.checkoutMissing'];

  let err = validateGuest('g1');
  if (err) return err;

  if (secondGuestAdded) {
    err = validateGuest('g2');
    if (err) return err;
  }
  return null;
}

// ── INVIO ──

function collectGuest(prefix) {
  return {
    sesso: $(`${prefix}-sesso`).value,
    cognome: $(`${prefix}-cognome`).value.trim(),
    nome: $(`${prefix}-nome`).value.trim(),
    dataNascita: $(`${prefix}-dataNascita`).value,
    // Se selezionata dai suggerimenti, invia sempre il nome italiano
    // canonico, indipendentemente dalla lingua mostrata nel campo.
    cittadinanza: cittadinanzaCanonical[`${prefix}-cittadinanza`] || $(`${prefix}-cittadinanza`).value.trim(),
    luogoNascita: $(`${prefix}-luogoNascita`).value.trim(),
    luogoResidenza: $(`${prefix}-luogoResidenza`).value.trim(),
    tipoDocumento: $(`${prefix}-tipoDocumento`).value,
    numeroDocumento: $(`${prefix}-numeroDocumento`).value.trim(),
    luogoRilascio: $(`${prefix}-luogoRilascio`).value.trim(),
    indirizzoResidenza: $(`${prefix}-fatturaCheck`).checked
      ? ($(`${prefix}-indirizzoResidenza`).value.trim() || null) : null,
    codiceFiscale: $(`${prefix}-fatturaCheck`).checked
      ? ($(`${prefix}-codiceFiscale`).value.trim() || null) : null
  };
}

let checkinBusy = false;

function setCheckinBusy(busy) {
  checkinBusy = busy;
  $('checkin-btn').disabled = busy;
  $('checkin-spinner').classList.toggle('on', busy);
  $('checkin-label').textContent = busy ? T[lang]['btn.submitBusy'] : T[lang]['btn.submit'];
}

$('checkin-form').addEventListener('submit', async e => {
  e.preventDefault();

  const validationError = validateForm();
  if (validationError) {
    $('form-error').textContent = validationError;
    $('form-error').style.display = 'block';
    return;
  }

  const checkIn = $('ci-checkin').value;
  const checkOut = $('ci-checkout').value;
  const ospiti = [collectGuest('g1')];
  if (secondGuestAdded) ospiti.push(collectGuest('g2'));

  setCheckinBusy(true);
  $('form-error').style.display = 'none';

  try {
    const res = await fetch('/api/checkin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ codice, checkIn, checkOut, ospiti })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || T[lang]['err.submitGeneric']);
    }

    showScreen('thanks-screen');
  } catch (err) {
    $('form-error').textContent = err.message;
    $('form-error').style.display = 'block';
  } finally {
    setCheckinBusy(false);
  }
});

applyLang(lang);
