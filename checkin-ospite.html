<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="robots" content="noindex, nofollow, noarchive"/>
<title>Check-in ospiti · Suite in Centro</title>
<style>
:root {
  --red: #FF385C;
  --black: #222222;
  --gray: #717171;
  --gray-light: #B0B0B0;
  --border: #DDDDDD;
  --border-inner: #EBEBEB;
  --surface: #F7F7F7;
  --white: #FFFFFF;
  --radius: 12px;
  --radius-sm: 8px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  color: var(--black);
  background: var(--surface);
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
}

.content {
  max-width: 560px;
  margin: 0 auto;
  padding: 24px 16px 48px;
}

.page-header { text-align: center; margin-bottom: 20px; }
.page-title { font-size: 20px; font-weight: 800; }
.page-sub { font-size: 13px; color: var(--gray); margin-top: 4px; }

/* ── STATO PAGINA (loading / invalido / grazie) ── */
.status-screen {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 48px 24px;
  text-align: center;
  display: none;
}
.status-screen.show { display: block; }
.status-icon { font-size: 40px; margin-bottom: 14px; }
.status-title { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
.status-text { font-size: 14px; color: var(--gray); line-height: 1.6; }

/* ── FORM ── */
.form-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 16px;
  display: none;
}
.form-card.show { display: block; }

.form-row { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.field-label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 5px; }

.field-sm, select.field-sm {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font: inherit;
  font-size: 15px;
  background: var(--surface);
  color: var(--black);
  -webkit-appearance: none;
}
.field-sm:focus { outline: none; border-color: var(--black); background: var(--white); }

.guest-block {
  border-top: 1px solid var(--border-inner);
  padding-top: 14px;
  margin-top: 4px;
}
.guest-title { font-size: 13px; font-weight: 700; color: var(--black); margin-bottom: 12px; }

.mini-divider {
  font-size: 11px;
  font-weight: 700;
  color: var(--gray);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin: 14px 0 8px;
  padding-top: 12px;
  border-top: 1px dashed var(--border-inner);
}

.checkbox-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 600;
  margin-top: 2px;
}
.checkbox-row input[type="checkbox"] { width: 18px; height: 18px; flex-shrink: 0; }

.fattura-fields { display: none; flex-direction: column; gap: 10px; margin-top: 10px; }
.fattura-fields.open { display: flex; }

.outline-btn {
  width: 100%;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1.5px solid var(--black);
  border-radius: var(--radius-sm);
  background: var(--white);
  color: var(--black);
  font: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s;
  margin-top: 4px;
}
.outline-btn:active { background: var(--surface); }

.remove-guest-btn {
  background: none;
  border: none;
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  color: var(--gray);
  cursor: pointer;
  padding: 10px 0 2px;
  text-align: left;
}
.remove-guest-btn:active { color: var(--red); }

.form-error { font-size: 13px; color: var(--red); margin-top: 8px; display: none; }
.form-submit { margin-top: 16px; }

.btn-red {
  width: 100%;
  padding: 14px;
  background: var(--red);
  color: var(--white);
  border: none;
  border-radius: var(--radius-sm);
  font: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: opacity 0.15s;
}
.btn-red:active { opacity: 0.85; }
.btn-red:disabled { opacity: 0.45; cursor: default; }

.spinner {
  width: 18px;
  height: 18px;
  border: 2.5px solid rgba(255,255,255,0.4);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: none;
}
.spinner.on { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="content">
  <div class="page-header">
    <div class="page-title">Check-in ospiti</div>
    <div class="page-sub">Suite in Centro · Treviso</div>
  </div>

  <div class="status-screen" id="loading-screen">
    <div class="status-icon">⏳</div>
    <div class="status-title">Verifica in corso…</div>
  </div>

  <div class="status-screen" id="invalid-screen">
    <div class="status-icon">🔒</div>
    <div class="status-title">Link non valido</div>
    <div class="status-text">Questo link non è valido o è scaduto.<br/>Contatta la struttura per riceverne uno nuovo.</div>
  </div>

  <div class="status-screen" id="thanks-screen">
    <div class="status-icon">✅</div>
    <div class="status-title">Grazie!</div>
    <div class="status-text">I tuoi dati sono stati ricevuti correttamente.</div>
  </div>

  <div class="form-card" id="form-card">
    <form id="checkin-form">
      <div class="form-row-2">
        <div>
          <label class="field-label" for="ci-checkin">Data arrivo</label>
          <input type="date" id="ci-checkin" class="field-sm" required/>
        </div>
        <div>
          <label class="field-label" for="ci-checkout">Data partenza</label>
          <input type="date" id="ci-checkout" class="field-sm" required/>
        </div>
      </div>

      <!-- Ospite 1 -->
      <div class="guest-block" id="guest-1" style="border-top:none;padding-top:0">
        <div class="guest-title">Ospite 1</div>

        <div class="form-row">
          <div>
            <label class="field-label" for="g1-sesso">Sesso</label>
            <select id="g1-sesso" class="field-sm" required>
              <option value="" disabled selected>Seleziona</option>
              <option value="M">M</option>
              <option value="F">F</option>
            </select>
          </div>
        </div>
        <div class="form-row-2">
          <div>
            <label class="field-label" for="g1-cognome">Cognome</label>
            <input type="text" id="g1-cognome" class="field-sm" placeholder="es. Rossi" autocapitalize="words" required/>
          </div>
          <div>
            <label class="field-label" for="g1-nome">Nome</label>
            <input type="text" id="g1-nome" class="field-sm" placeholder="es. Mario" autocapitalize="words" required/>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label class="field-label" for="g1-dataNascita">Data di nascita</label>
            <input type="date" id="g1-dataNascita" class="field-sm" required/>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label class="field-label" for="g1-cittadinanza">Cittadinanza</label>
            <input type="text" id="g1-cittadinanza" class="field-sm" placeholder="es. Italia" required/>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label class="field-label" for="g1-luogoNascita">Stato/luogo di nascita</label>
            <input type="text" id="g1-luogoNascita" class="field-sm" placeholder="es. Treviso" required/>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label class="field-label" for="g1-luogoResidenza">Stato/luogo di residenza</label>
            <input type="text" id="g1-luogoResidenza" class="field-sm" placeholder="es. Milano" required/>
          </div>
        </div>
        <div class="form-row-2">
          <div>
            <label class="field-label" for="g1-tipoDocumento">Tipo documento</label>
            <select id="g1-tipoDocumento" class="field-sm" required>
              <option value="" disabled selected>Seleziona</option>
              <option>Carta d'identità</option>
              <option>Passaporto</option>
              <option>Patente</option>
            </select>
          </div>
          <div>
            <label class="field-label" for="g1-numeroDocumento">Numero documento</label>
            <input type="text" id="g1-numeroDocumento" class="field-sm" placeholder="es. AB1234567" required/>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label class="field-label" for="g1-luogoRilascio">Stato/luogo di rilascio</label>
            <input type="text" id="g1-luogoRilascio" class="field-sm" placeholder="es. Treviso" required/>
          </div>
        </div>

        <div class="mini-divider">Per fattura</div>
        <label class="checkbox-row">
          <input type="checkbox" id="g1-fatturaCheck"/>
          Residente in Italia (per fattura)
        </label>
        <div class="fattura-fields" id="g1-fatturaFields">
          <div>
            <label class="field-label" for="g1-indirizzoResidenza">Indirizzo di residenza completo</label>
            <input type="text" id="g1-indirizzoResidenza" class="field-sm" placeholder="Via, numero civico, CAP, città"/>
          </div>
          <div>
            <label class="field-label" for="g1-codiceFiscale">Codice Fiscale</label>
            <input type="text" id="g1-codiceFiscale" class="field-sm" placeholder="es. RSSMRA80A01L407K" autocapitalize="characters"/>
          </div>
        </div>
      </div>

      <button type="button" class="outline-btn" id="add-guest-btn">
        + Aggiungi secondo ospite
      </button>

      <!-- Ospite 2 (nascosto finché non aggiunto) -->
      <div class="guest-block" id="guest-2" style="display:none">
        <div class="guest-title">Ospite 2</div>

        <div class="form-row">
          <div>
            <label class="field-label" for="g2-sesso">Sesso</label>
            <select id="g2-sesso" class="field-sm">
              <option value="" disabled selected>Seleziona</option>
              <option value="M">M</option>
              <option value="F">F</option>
            </select>
          </div>
        </div>
        <div class="form-row-2">
          <div>
            <label class="field-label" for="g2-cognome">Cognome</label>
            <input type="text" id="g2-cognome" class="field-sm" placeholder="es. Bianchi" autocapitalize="words"/>
          </div>
          <div>
            <label class="field-label" for="g2-nome">Nome</label>
            <input type="text" id="g2-nome" class="field-sm" placeholder="es. Anna" autocapitalize="words"/>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label class="field-label" for="g2-dataNascita">Data di nascita</label>
            <input type="date" id="g2-dataNascita" class="field-sm"/>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label class="field-label" for="g2-cittadinanza">Cittadinanza</label>
            <input type="text" id="g2-cittadinanza" class="field-sm" placeholder="es. Italia"/>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label class="field-label" for="g2-luogoNascita">Stato/luogo di nascita</label>
            <input type="text" id="g2-luogoNascita" class="field-sm" placeholder="es. Treviso"/>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label class="field-label" for="g2-luogoResidenza">Stato/luogo di residenza</label>
            <input type="text" id="g2-luogoResidenza" class="field-sm" placeholder="es. Milano"/>
          </div>
        </div>
        <div class="form-row-2">
          <div>
            <label class="field-label" for="g2-tipoDocumento">Tipo documento</label>
            <select id="g2-tipoDocumento" class="field-sm">
              <option value="" disabled selected>Seleziona</option>
              <option>Carta d'identità</option>
              <option>Passaporto</option>
              <option>Patente</option>
            </select>
          </div>
          <div>
            <label class="field-label" for="g2-numeroDocumento">Numero documento</label>
            <input type="text" id="g2-numeroDocumento" class="field-sm" placeholder="es. AB1234567"/>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label class="field-label" for="g2-luogoRilascio">Stato/luogo di rilascio</label>
            <input type="text" id="g2-luogoRilascio" class="field-sm" placeholder="es. Treviso"/>
          </div>
        </div>

        <div class="mini-divider">Per fattura</div>
        <label class="checkbox-row">
          <input type="checkbox" id="g2-fatturaCheck"/>
          Residente in Italia (per fattura)
        </label>
        <div class="fattura-fields" id="g2-fatturaFields">
          <div>
            <label class="field-label" for="g2-indirizzoResidenza">Indirizzo di residenza completo</label>
            <input type="text" id="g2-indirizzoResidenza" class="field-sm" placeholder="Via, numero civico, CAP, città"/>
          </div>
          <div>
            <label class="field-label" for="g2-codiceFiscale">Codice Fiscale</label>
            <input type="text" id="g2-codiceFiscale" class="field-sm" placeholder="es. RSSMRA80A01L407K" autocapitalize="characters"/>
          </div>
        </div>

        <button type="button" class="remove-guest-btn" id="remove-guest-btn">− Rimuovi secondo ospite</button>
      </div>

      <div class="form-error" id="form-error"></div>

      <button type="submit" class="btn-red form-submit" id="checkin-btn">
        <span class="spinner" id="checkin-spinner"></span>
        <span id="checkin-label">Invia i tuoi dati</span>
      </button>
    </form>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const codice = new URLSearchParams(location.search).get('codice');

function showScreen(id) {
  ['loading-screen', 'invalid-screen', 'thanks-screen', 'form-card'].forEach(s => {
    $(s).classList.toggle('show', s === id);
  });
}

(async () => {
  showScreen('loading-screen');

  if (!codice) {
    showScreen('invalid-screen');
    return;
  }

  try {
    const res = await fetch(`/api/verifica-codice?codice=${encodeURIComponent(codice)}`);
    const data = await res.json();
    if (data.ok) {
      $('ci-checkin').value = new Date().toISOString().split('T')[0];
      showScreen('form-card');
    } else {
      showScreen('invalid-screen');
    }
  } catch {
    showScreen('invalid-screen');
  }
})();

// ── SECONDO OSPITE ──

let secondGuestAdded = false;
const g2RequiredFields = ['g2-sesso', 'g2-cognome', 'g2-nome', 'g2-dataNascita',
  'g2-cittadinanza', 'g2-luogoNascita', 'g2-luogoResidenza', 'g2-tipoDocumento',
  'g2-numeroDocumento', 'g2-luogoRilascio'];

$('add-guest-btn').addEventListener('click', () => {
  secondGuestAdded = true;
  $('guest-2').style.display = 'block';
  $('add-guest-btn').style.display = 'none';
  g2RequiredFields.forEach(id => $(id).required = true);
});

$('remove-guest-btn').addEventListener('click', () => {
  secondGuestAdded = false;
  $('guest-2').style.display = 'none';
  $('add-guest-btn').style.display = 'flex';
  g2RequiredFields.forEach(id => { $(id).required = false; $(id).value = ''; });
  $('g2-fatturaCheck').checked = false;
  $('g2-fatturaFields').classList.remove('open');
  $('g2-indirizzoResidenza').value = '';
  $('g2-codiceFiscale').value = '';
});

// ── CHECKBOX "PER FATTURA" ──

['g1', 'g2'].forEach(prefix => {
  $(`${prefix}-fatturaCheck`).addEventListener('change', e => {
    $(`${prefix}-fatturaFields`).classList.toggle('open', e.target.checked);
  });
});

// ── INVIO ──

function collectGuest(prefix) {
  return {
    sesso: $(`${prefix}-sesso`).value,
    cognome: $(`${prefix}-cognome`).value.trim(),
    nome: $(`${prefix}-nome`).value.trim(),
    dataNascita: $(`${prefix}-dataNascita`).value,
    cittadinanza: $(`${prefix}-cittadinanza`).value.trim(),
    luogoNascita: $(`${prefix}-luogoNascita`).value.trim(),
    luogoResidenza: $(`${prefix}-luogoResidenza`).value.trim(),
    tipoDocumento: $(`${prefix}-tipoDocumento`).value,
    numeroDocumento: $(`${prefix}-numeroDocumento`).value.trim(),
    luogoRilascio: $(`${prefix}-luogoRilascio`).value.trim(),
    indirizzoResidenza: $(`${prefix}-fatturaCheck`).checked
      ? ($(`${prefix}-indirizzoResidenza`).value.trim() || null) : null,
    codiceFiscale: $(`${prefix}-fatturaCheck`).checked
      ? ($(`${prefix}-codiceFiscale`).value.trim() || null) : null
  };
}

function setCheckinBusy(busy) {
  $('checkin-btn').disabled = busy;
  $('checkin-spinner').classList.toggle('on', busy);
  $('checkin-label').textContent = busy ? 'Invio in corso...' : 'Invia i tuoi dati';
}

$('checkin-form').addEventListener('submit', async e => {
  e.preventDefault();

  const checkIn = $('ci-checkin').value;
  const checkOut = $('ci-checkout').value;
  const ospiti = [collectGuest('g1')];
  if (secondGuestAdded) ospiti.push(collectGuest('g2'));

  setCheckinBusy(true);
  $('form-error').style.display = 'none';

  try {
    const res = await fetch('/api/checkin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ codice, checkIn, checkOut, ospiti })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || 'Errore durante l\'invio');
    }

    showScreen('thanks-screen');
  } catch (err) {
    $('form-error').textContent = err.message;
    $('form-error').style.display = 'block';
  } finally {
    setCheckinBusy(false);
  }
});
</script>
</body>
</html>
